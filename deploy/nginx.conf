# nginx in front of dalibot-gallery: TLS ends here, the gallery listens on
# 127.0.0.1:8080. Put this in /etc/nginx/conf.d/gallery.conf (or sites-available)
# and change the host name and the certificate paths.
#
# The gallery sends its own Content-Security-Policy, X-Content-Type-Options,
# Referrer-Policy, Permissions-Policy and X-Frame-Options. This file neither
# hides nor repeats them (no proxy_hide_header, no add_header for those names).
# The one header added is HSTS, which the gallery does not send.

server {
    listen 80;
    listen [::]:80;
    server_name gallery.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx 1.25.1 or later; before that: "listen 443 ssl http2;"
    server_name gallery.example.com;

    ssl_certificate     /etc/letsencrypt/live/gallery.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gallery.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The only request bodies the gallery accepts are the login form and the empty sign-out.
    client_max_body_size 8k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Appends the client's address as the last entry. The gallery counts
        # wrong tokens by that entry, so a client cannot choose it. It believes
        # the header only from the addresses in GALLERY_TRUSTED_PROXIES:
        # loopback by default, which is right for nginx on the same host as a
        # gallery without a container; deploy/compose.yaml sets it to the
        # address the container sees this nginx connect from.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Do not add proxy_cache here when viewing needs GALLERY_TOKEN. Image
        # responses are then behind the login, and the gallery marks them
        # "private, immutable", which nginx's cache respects unless
        # proxy_ignore_headers says otherwise. In a public gallery
        # (GALLERY_PUBLIC=1) they are "public" and may be cached. Never cache
        # the pages or /api/: they are "no-store" and differ for an admin.

        # A gallery without a password is GALLERY_PUBLIC=1 in the gallery's
        # own settings; nothing changes here. Do not make nginx present a
        # token for visitors. See "A public gallery behind a proxy" in the README.

        # Longer than the gallery's own 60 s write timeout.
        proxy_read_timeout 75s;
    }
}
