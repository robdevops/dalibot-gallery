# nginx in front of dalibot-gallery: TLS ends here, the gallery listens on
# 127.0.0.1:8080. Put this in /etc/nginx/conf.d/gallery.conf (or sites-available)
# and change the host name and the certificate paths.
#
# The gallery sends its own Content-Security-Policy, X-Content-Type-Options,
# Referrer-Policy, Permissions-Policy and X-Frame-Options. This file neither
# hides nor repeats them (no proxy_hide_header, no add_header for those names).
# The one header added is HSTS, which the gallery does not send.

server {
    listen 80;
    listen [::]:80;
    server_name gallery.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx 1.25.1 or later; before that: "listen 443 ssl http2;"
    server_name gallery.example.com;

    ssl_certificate     /etc/letsencrypt/live/gallery.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gallery.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The only request body the gallery accepts is the login form.
    client_max_body_size 8k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Appends the client's address as the last entry. The gallery counts
        # failed logins by that last entry, so a client cannot choose it.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Do not add proxy_cache here. Image responses are marked
        # "public, immutable" for the browser, but they are behind the login:
        # a shared cache at the proxy would serve them to anyone.

        # Longer than the gallery's own 60 s write timeout.
        proxy_read_timeout 75s;
    }
}
