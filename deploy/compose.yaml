# dalibot-gallery with Docker Compose.
#
#   cp .env.example .env        # then fill in the token (or GALLERY_PUBLIC=1), the AWS key and the bot token
#   docker compose -f deploy/compose.yaml up -d --build
#
# The gallery is then on http://127.0.0.1:8080 of the host, for a TLS reverse
# proxy on the same host (deploy/nginx.conf, deploy/Caddyfile). It is not
# reachable from other machines. For Traefik in Docker, add
# deploy/traefik-labels.yaml as a second -f file. For a self-hosted bot that
# keeps its records in SQLite, add deploy/compose.sqlite.yaml as a second -f
# file (it mounts the bot's database directory read-only; .env then needs no AWS key).

services:
  gallery:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dalibot-gallery:local
    restart: unless-stopped

    env_file:
      - ../.env
    # These are fixed for the container and override .env.
    environment:
      GALLERY_LISTEN: "0.0.0.0:8080"
      GALLERY_CACHE_DIR: /var/cache/dalibot-gallery
      GALLERY_STATE_DIR: /var/lib/dalibot-gallery
      # The reverse proxy on the host connects through the published port, and
      # the container sees those connections as coming from the gateway of
      # its network (pinned below). Only from that address is X-Forwarded-For
      # believed. If you change the subnet, change this to its gateway.
      GALLERY_TRUSTED_PROXIES: "172.30.80.1"

    # Localhost only: the reverse proxy is the only way in.
    ports:
      - "127.0.0.1:8080:8080"

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A hard cap: libvips' own cache limits do not bound the process.
    mem_limit: 512m
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - cache:/var/cache/dalibot-gallery
      - state:/var/lib/dalibot-gallery
    stop_grace_period: 20s

networks:
  # A fixed subnet, so that the gateway address above is known. Pick another
  # private range if this one is in use on the host.
  default:
    ipam:
      config:
        - subnet: 172.30.80.0/24
          gateway: 172.30.80.1

volumes:
  # Originals and thumbnails. Safe to delete: everything is fetched and made again.
  cache:
  # The gallery's own state: the list of images an admin has hidden
  # (docs/admin.md). Keep it, and back it up; deleting it shows them all again.
  state:
