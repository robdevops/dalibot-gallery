<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Gallery for dalibot AI images">
<meta property="og:title" content="Gallery">
<meta property="og:description" content="Gallery for dalibot AI images">
<meta property="og:image" content="https://raw.githubusercontent.com/robdevops/dalibot-gallery/main/docs/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="480">
<meta property="og:image:height" content="480">
<meta property="og:image:alt" content="A caricature of Salvador Dalí">
<meta name="twitter:card" content="summary">
<title>Sign in · Gallery</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="login">
<h1>Gallery</h1>
<form method="post" action="/login">
  <label for="token">{{if .AdminOnly}}Admin token{{else}}Access token{{end}}</label>
  <input type="password" id="token" name="token" autocomplete="current-password" required autofocus{{if .Error}} aria-describedby="err"{{end}}>
  <button type="submit">Sign in</button>
</form>
{{if .Error}}<p class="err" id="err" role="alert">That token is not right. Try again.</p>{{end}}
{{if .AdminOnly}}<p class="back"><a href="/">Back to the gallery</a></p>{{end}}
</main>
</body>
</html>
