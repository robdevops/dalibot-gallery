<!doctype html>
<html lang="en"{{if .Admin}} data-admin="1"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Gallery for dalibot AI images">
<meta property="og:title" content="Gallery">
<meta property="og:description" content="Gallery for dalibot AI images">
<meta property="og:image" content="https://raw.githubusercontent.com/robdevops/dalibot-gallery/main/docs/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="480">
<meta property="og:image:height" content="480">
<meta property="og:image:alt" content="A caricature of Salvador Dalí">
<meta name="twitter:card" content="summary">
<title>{{.Title}}</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
{{if .Hide}}<link rel="stylesheet" href="/admin.css">
<script src="/admin.js" defer></script>
{{end}}</head>
<body>
<h1 class="sr">{{.Title}}</h1>
<button type="button" class="pill" id="pill" hidden></button>
<main>
<ul class="grid" id="grid" aria-label="Gallery"></ul>
<noscript>
  <ul class="grid">
    {{range .Tiles}}<li class="tile"><a href="{{.Full}}"><img src="{{.Src240}}" srcset="{{.Src240}} 240w, {{.Src480}} 480w" sizes="(min-width:1600px) 17vw, (min-width:1200px) 20vw, (min-width:768px) 25vw, (min-width:480px) 34vw, 50vw" width="240" height="240" loading="lazy" decoding="async" alt="{{.Alt}}"></a></li>{{end}}
  </ul>
  {{if .Next}}<p class="more"><a href="/?cursor={{.Next}}{{if .Style}}&amp;style={{.Style}}{{end}}">Load more</a></p>{{end}}
</noscript>
<p class="end" id="end"></p>
</main>
{{if or .SignOut .AdminLogin .Hide}}<footer class="foot">
{{if .Hide}}<a href="/admin/hidden">Hidden images</a>{{end}}
{{if .AdminLogin}}<a href="/login">Admin</a>{{end}}
{{if .SignOut}}<form method="post" action="/logout"><button type="submit">Sign out</button></form>{{end}}
</footer>{{end}}
<p class="sr" id="live" aria-live="polite"></p>
<dialog id="lb" aria-label="Image viewer">
<div class="box">
  <div class="stage">
    <img id="full" alt="" draggable="false">
    <button type="button" class="nav" id="x" aria-label="Close" autofocus>&#215;</button>
    <button type="button" class="nav" id="prev" aria-label="Previous image">&#8249;</button>
    <button type="button" class="nav" id="next" aria-label="Next image">&#8250;</button>
  </div>
  <div class="meta">
    <p id="cap"></p>
    <p id="cmd"></p>
    <ul id="strip" aria-label="Nearby images"></ul>
  </div>
</div>
</dialog>
</body>
</html>
